name: auto-merge

# ippoan/ci-workflows の auto-merge.yml reusable workflow を呼ぶ。GitHub App
# (CI_APP_ID/CI_APP_PRIVATE_KEY) の installation token で `gh pr merge --auto`
# を実行する。
#
# Prerequisites (one-time, in repo Settings):
#   - General → "Allow auto-merge" is ON
#   - Branches → main protection requires the `ci / shellcheck` check
#     from test.yml. Without that, this would merge instantly.
#
# 旧実装は個人 PAT (TAG_RELEASE_PAT、GITHUB_TOKEN だと downstream workflow
# (pages.yml 等) が発火しないため個人 PAT を使っていた) を使っており、
# Claude Code session 等が同一アカウントで GitHub API を大量に叩くと GraphQL
# rate limit を共有して枯渇し `gh pr merge --auto` が間欠的に失敗していた
# (Refs #90 のフォローアップ)。GitHub App token は個人アカウントとは別の
# rate-limit バケットを持ち、かつ push actor が github-actions[bot] にならず
# downstream workflow を正常に発火させる (ci-workflows#65 で同種の問題を
# 解決済み)。

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    if: github.event.pull_request.draft == false
    uses: ippoan/ci-workflows/.github/workflows/auto-merge.yml@main
    secrets: inherit
