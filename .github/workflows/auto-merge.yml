name: auto-merge

# Flips the "auto-merge" flag on the PR via gh CLI. The actual merge gate
# is the branch protection rule on the target branch, not this workflow.
#
# Prerequisites (one-time, in repo Settings):
#   - General → "Allow auto-merge" is ON
#   - Branches → main protection requires the `ci / shellcheck` check
#     from test.yml. Without that, this would merge instantly.
#
# Why TAG_RELEASE_PAT (org secret) instead of GITHUB_TOKEN:
#   GitHub suppresses workflow runs for events triggered by GITHUB_TOKEN
#   (docs: "events triggered by the GITHUB_TOKEN will not create a new
#   workflow run", except workflow_dispatch / repository_dispatch). So a PR
#   auto-merged under GITHUB_TOKEN pushes to main as github-actions[bot] and
#   that push does NOT fire pages.yml / test.yml → the Pages site never
#   auto-deploys (had to dispatch manually). Enabling auto-merge with a
#   user-scoped PAT makes the eventual merge push attributed to a real user,
#   so the on:push workflows run normally. Falls back to GITHUB_TOKEN if the
#   PAT isn't present (auto-merge still works, just without downstream runs).

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened, synchronize]

permissions:
  pull-requests: write
  contents: write

jobs:
  enable-auto-merge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.TAG_RELEASE_PAT || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
