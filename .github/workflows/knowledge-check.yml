name: knowledge-check

# knowledge/ エントリの規約リンター。decisions/ standards/ の frontmatter・命名・
# Summary 等を検証し、error が 1 件でもあれば fail (PR をブロック)。warn は exit 0。
# 規約定義は knowledge/rules.json が SoT、実装は knowledge/scripts/check.py。

on:
  push:
    branches: [main]
    paths:
      - 'knowledge/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'knowledge/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Lint knowledge entries (blocking on error)
        run: python3 knowledge/scripts/check.py
      - name: Unit tests
        run: python3 -m unittest discover -s knowledge/tests -p 'test_*.py'
      - name: SKILL.md lint (warn only, non-blocking)
        run: python3 knowledge/scripts/check.py --skills
