name: Pages

# auto-merge は TAG_RELEASE_PAT (実ユーザー) で merge するため、merge の
# main push は GITHUB_TOKEN 抑止を受けず下の `push` トリガーが正常発火する。
# (PAT 化前は #31 で pull_request_target:closed を併用していたが、PAT 化で
#  push が効くため撤去 = merge ごとに Pages run が 1 本だけになる)
on:
  push:
    branches: [main]
    paths:
      - '**/SKILL.md'
      - 'README.md'
      - 'mkdocs.yml'
      - 'scripts/build_docs.py'
      - 'requirements-docs.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを 1 本に制限 (走行中の deploy は止めない)。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install MkDocs
        run: pip install -r requirements-docs.txt
      - name: Generate docs from SKILL.md
        run: python scripts/build_docs.py
      - name: Build site
        run: mkdocs build --strict   # SKILL.md のリンク切れを CI で検出する
      - uses: actions/configure-pages@v5
        with:
          # Pages 未有効の repo でも Actions ソースを自動有効化する。
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
